<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identidade Visual • Radar das Promoções</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050811;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
    }

    .brand-showcase {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    /* =====================================================
       LOGO SVG ANIMADO: RADAR + TAG DE DESCONTO
       ===================================================== */
    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }

    /* Ondas de Sonar (pulse rings) */
    .sonar-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(0, 255, 163, 0.3);
      animation: sonarPulse 2.4s ease-out infinite;
    }
    .sonar-ring:nth-child(2) { animation-delay: 0.8s; }
    .sonar-ring:nth-child(3) { animation-delay: 1.6s; }

    @keyframes sonarPulse {
      0%   { transform: scale(0.5); opacity: 0.9; border-color: rgba(0, 255, 163, 0.6); }
      100% { transform: scale(1.6); opacity: 0;   border-color: rgba(0, 255, 163, 0); }
    }

    /* Círculo externo */
    .radar-outer {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 255, 163, 0.25);
      background: rgba(0, 255, 163, 0.04);
    }

    /* Anel interno pontilhado */
    .radar-inner {
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 255, 163, 0.18);
    }

    /* SVG principal com o radar girando */
    .radar-svg {
      position: absolute;
      inset: 8px;
      width: calc(100% - 16px);
      height: calc(100% - 16px);
    }

    /* Sweep (varredura do radar) */
    .radar-sweep {
      transform-origin: 50% 50%;
      animation: radarRotate 3s linear infinite;
    }

    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Tag de desconto no centro */
    .tag-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .discount-tag-svg {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 0 8px rgba(0, 255, 163, 0.8));
    }

    /* Ponto de "alvo" do radar */
    .radar-blip {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #00FFA3;
      border-radius: 50%;
      box-shadow: 0 0 10px #00FFA3, 0 0 20px rgba(0, 255, 163, 0.5);
      animation: blipFade 3s ease-out infinite;
    }

    .blip-1 { top: 20%; left: 65%; animation-delay: 0.3s; }
    .blip-2 { top: 55%; left: 22%; animation-delay: 1.1s; }
    .blip-3 { top: 72%; left: 60%; animation-delay: 2s; }

    @keyframes blipFade {
      0%, 100% { opacity: 0; transform: scale(0); }
      30%, 60%  { opacity: 1; transform: scale(1); }
    }

    /* =====================================================
       TIPOGRAFIA DA MARCA
       ===================================================== */
    .brand-text-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-wordmark {
      display: flex;
      align-items: baseline;
      gap: 0;
      line-height: 1;
    }

    .brand-word-radar {
      font-size: 3rem;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.04em;
    }

    .brand-word-promo {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #00FFA3 0%, #00D4FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
    }

    .brand-tagline {
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .brand-sub-icons {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .marketplace-dot {
      font-size: 0.7rem;
      color: rgba(0, 255, 163, 0.7);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .dot-sep {
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
    }

  </style>
</head>
<body>

  <div class="brand-showcase">

    <!-- ============ LOGO ANIMADO ============ -->
    <div class="logo-container">

      <!-- Ondas de Sonar -->
      <div class="sonar-ring"></div>
      <div class="sonar-ring"></div>
      <div class="sonar-ring"></div>

      <!-- Anel externo -->
      <div class="radar-outer"></div>
      <!-- Anel interno -->
      <div class="radar-inner"></div>

      <!-- RADAR SVG ROTATIVO -->
      <svg class="radar-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Grade do radar (linhas cruzadas) -->
        <line x1="50" y1="10" x2="50" y2="90" stroke="rgba(0,255,163,0.1)" stroke-width="0.8"/>
        <line x1="10" y1="50" x2="90" y2="50" stroke="rgba(0,255,163,0.1)" stroke-width="0.8"/>

        <!-- Círculos de grade -->
        <circle cx="50" cy="50" r="35" stroke="rgba(0,255,163,0.12)" stroke-width="0.8"/>
        <circle cx="50" cy="50" r="20" stroke="rgba(0,255,163,0.12)" stroke-width="0.8"/>

        <!-- SWEEP: triângulo de varredura com gradiente -->
        <g class="radar-sweep">
          <defs>
            <radialGradient id="sweepGrad" cx="50%" cy="100%" r="100%">
              <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <path d="M50 50 L50 15 A35 35 0 0 1 77 27 Z"
            fill="url(#sweepGrad)" />
          <!-- Linha guia do sweep -->
          <line x1="50" y1="50" x2="50" y2="15"
            stroke="#00FFA3" stroke-width="1.2" opacity="0.9"/>
        </g>

        <!-- Ponto central -->
        <circle cx="50" cy="50" r="2.5" fill="#00FFA3"
          style="filter: drop-shadow(0 0 4px #00FFA3)"/>
      </svg>

      <!-- TAG DE DESCONTO NO CENTRO DO RADAR -->
      <div class="tag-center">
        <svg class="discount-tag-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Tag body -->
          <path d="M6 6 L22 6 L30 18 L22 30 L6 30 Z"
            fill="rgba(0,255,163,0.15)"
            stroke="#00FFA3"
            stroke-width="1.5"
            stroke-linejoin="round"/>
          <!-- Buraco da tag -->
          <circle cx="11" cy="13" r="2" stroke="#00FFA3" stroke-width="1.2"/>
          <!-- Símbolo % -->
          <text x="14" y="23"
            font-family="Outfit, sans-serif"
            font-size="10"
            font-weight="900"
            fill="#00FFA3">%</text>
        </svg>
      </div>

      <!-- Blips de radar -->
      <div class="radar-blip blip-1"></div>
      <div class="radar-blip blip-2"></div>
      <div class="radar-blip blip-3"></div>

    </div>
    <!-- ============ FIM LOGO ============ -->

    <!-- TIPOGRAFIA -->
    <div class="brand-text-block">
      <div class="brand-wordmark">
        <span class="brand-word-radar">Radar</span>
        <span class="brand-word-promo">Promo</span>
      </div>
      <span class="brand-tagline">Inteligência em Ofertas & Bugs</span>
      <div class="brand-sub-icons">
        <span class="marketplace-dot">Amazon</span>
        <span class="dot-sep"></span>
        <span class="marketplace-dot">Shopee</span>
        <span class="dot-sep"></span>
        <span class="marketplace-dot">Mercado Livre</span>
        <span class="dot-sep"></span>
        <span class="marketplace-dot">Magalu</span>
      </div>
    </div>

  </div>

</body>
</html>
